<mat-dialog-content>
  <p mat-dialog-title>{{data.title}}</p>
  <mat-form-field>
    <mat-label>{{data.title}}</mat-label>
    <input matInput [type]="data.inputType ?? 'text'" [(ngModel)]="newName" (keydown.enter)="onAdd()" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Anuluj</button>
  <button mat-button [mat-dialog-close]="newName" (click)="onAdd()">
    {{ data.defaultValue === null || data.defaultValue === undefined || data.defaultValue.length===0 ? 'Dodaj' : 'Zmień' }}

  </button>
</mat-dialog-actions>
