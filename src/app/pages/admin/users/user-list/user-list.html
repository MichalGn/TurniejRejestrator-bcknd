<app-list-header [title]="'Użytkownicy'" [removeAllAreYouSure]="'Czy na pewno usunąć wszystkich użytkowników?'"
    [removeAllConfirmation]="'Wszyscy użytkownicy usunięci prawidłowo'" [showAll]="'Pokaż wszystkich użytkowników'"
    [showOnlyActive]="'Pokaż użytkowników aktywnych'" [service]=service [itemsDataSource]="dataSource"
    (itemsDataSourceChanged)="handleDataSourceChanged($event)" (loadingChanged)="handleLoadingChanged($event)">
</app-list-header>

<div class="table-container">
    <div class="table-scroll">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 user-table">

            <ng-container matColumnDef="rowNumber">
                <th mat-header-cell *matHeaderCellDef style="text-align: right; padding-right: 0px">#</th>
                <td mat-cell *matCellDef="let element; let i = index" style="text-align: right; padding-right: 0px">
                    {{ i + 1 }}
                </td>
            </ng-container>

            <!-- Username Column -->
            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef> Użytkownik </th>
                <td mat-cell *matCellDef="let user"> {{ user.username }} </td>
            </ng-container>

            <!-- First Name Column -->
            <ng-container matColumnDef="firstname">
                <th mat-header-cell *matHeaderCellDef> Imię </th>
                <td mat-cell *matCellDef="let user"> {{ user.firstname }} </td>
            </ng-container>

            <!-- Last Name Column -->
            <ng-container matColumnDef="lastname">
                <th mat-header-cell *matHeaderCellDef> Nazwisko </th>
                <td mat-cell *matCellDef="let user"> {{ user.lastname }} </td>
            </ng-container>

            <ng-container matColumnDef="active">
                <th mat-header-cell *matHeaderCellDef> Aktywny </th>
                <td mat-cell *matCellDef="let user">
                    @if(user.active) {
                        <mat-icon color="primary">check</mat-icon>
                    } @else {
                        <mat-icon color="warn">close</mat-icon>
                    }
                </td>
            </ng-container>

            <!-- Actions Column (aligned right) -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="actions-header">
                    <button mat-mini-fab type="button" color="primary" matTooltip="+ Użytkownik"
                        (click)="openUserDialog()">
                        <mat-icon class="button-icon">add</mat-icon>
                    </button>
                </th>
                <td mat-cell *matCellDef="let user" class="actions-cell">
                    <button mat-icon-button color="primary" (click)="editUser(user)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="delete(user)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky:true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>


        @if (loading) {
        <div class="loading-spinner">
            <mat-progress-spinner mode="indeterminate" color="accent"></mat-progress-spinner>
        </div>
        }
    </div>
</div>
